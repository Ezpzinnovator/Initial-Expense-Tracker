<!DOCTYPE html>
<html>

<head>

    <title>Edit Expense</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="container">


        <!-- Header -->

        <header>

            <h1>✏️ Edit Expense</h1>

            <p>
                Update your expense details
            </p>

        </header>


        <!-- Edit Expense Card -->

        <section class="card">

            <h2>
                Edit Expense
            </h2>


            <form method="POST">


                <!-- Description -->

                <label for="description">
                    Description
                </label>

                <input
                    type="text"
                    id="description"
                    name="description"
                    value="{{ expense[1] }}"
                    required
                >


                <!-- Amount -->

                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    value="{{ expense[2] }}"
                    min="0.01"
                    max="100000000"
                    step="0.01"
                    required
                >


                <!-- Category -->

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="Food"
                        {% if expense[3] == "Food" %}selected{% endif %}>
                        Food
                    </option>

                    <option value="Transport"
                        {% if expense[3] == "Transport" %}selected{% endif %}>
                        Transport
                    </option>

                    <option value="Shopping"
                        {% if expense[3] == "Shopping" %}selected{% endif %}>
                        Shopping
                    </option>

                    <option value="Entertainment"
                        {% if expense[3] == "Entertainment" %}selected{% endif %}>
                        Entertainment
                    </option>

                    <option value="Health"
                        {% if expense[3] == "Health" %}selected{% endif %}>
                        Health
                    </option>

                    <option value="Education"
                        {% if expense[3] == "Education" %}selected{% endif %}>
                        Education
                    </option>

                    <option value="Travel"
                        {% if expense[3] == "Travel" %}selected{% endif %}>
                        Travel
                    </option>

                    <option value="Utilities"
                        {% if expense[3] == "Utilities" %}selected{% endif %}>
                        Utilities
                    </option>

                    <option value="Bills"
                        {% if expense[3] == "Bills" %}selected{% endif %}>
                        Bills
                    </option>

                    <option value="Other"
                        {% if expense[3] == "Other" %}selected{% endif %}>
                        Other
                    </option>

                </select>


                <!-- Date -->

                <label for="expense_date">
                    Date
                </label>

                <input
                    type="date"
                    id="expense_date"
                    name="expense_date"
                    value="{{ expense[4] }}"
                    required
                >


                <!-- Save -->

                <button type="submit">
                    Save Changes
                </button>

            </form>


            <br>


            <!-- Cancel -->

            <a href="/">
                Cancel
            </a>

        </section>

    </div>

</body>

</html>
